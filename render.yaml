services:
  # Backend Service
  - type: web
    name: acebits-backend
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # Add these in Render dashboard:
      # - MONGODB_URI
      # - JWT_SECRET
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET
      # - CORS_ORIGIN

  # Frontend Service
  - type: web
    name: acebits-frontend
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -p 3000
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      # Add in Render dashboard:
      # - REACT_APP_API_URL (your backend URL)